# =============================================================================
# Overlay-AI Docker Compose Configuration
# =============================================================================
# Development workflow orchestration for consistent builds and testing.
#
# Usage:
#   docker compose run --rm lint              # Run ESLint
#   docker compose run --rm typecheck         # Run TypeScript check
#   docker compose run --rm test              # Run Vitest tests
#   docker compose run --rm ci                # Full CI pipeline
#   docker compose run --rm dev bash          # Interactive shell
#
# Cross-platform Rust builds:
#   docker compose run --rm rust-build-linux   # Build Linux binary
#   docker compose run --rm rust-build-windows # Build Windows binary (cross-compile)
#   docker compose run --rm rust-build-all     # Build both Linux and Windows
#
# Note: macOS binaries cannot be cross-compiled and must be built natively.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Linting & Formatting
  # ---------------------------------------------------------------------------
  lint:
    build:
      context: .
      target: node-deps
    command: npm run lint
    volumes:
      - ./src:/app/src:ro

  typecheck:
    build:
      context: .
      target: node-deps
    command: npm run typecheck
    volumes:
      - ./src:/app/src:ro

  format-check:
    build:
      context: .
      target: node-deps
    command: npm run format:check
    volumes:
      - ./src:/app/src:ro

  # ---------------------------------------------------------------------------
  # Testing
  # ---------------------------------------------------------------------------
  test:
    build:
      context: .
      target: test-runner
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    env_file:
      - path: .env
        required: false

  test-coverage:
    build:
      context: .
      target: node-deps
    command: npm run test:coverage
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./coverage:/app/coverage
    env_file:
      - path: .env
        required: false

  # ---------------------------------------------------------------------------
  # TypeScript Build
  # ---------------------------------------------------------------------------
  build:
    build:
      context: .
      target: node-deps
    command: npm run build
    volumes:
      - ./dist:/app/dist

  # ---------------------------------------------------------------------------
  # Rust Audio Engine - Cross-Platform Builds
  # ---------------------------------------------------------------------------

  # Build Linux binary
  rust-build-linux:
    build:
      context: .
      target: rust-builder-linux
    volumes:
      - rust-target-linux:/app/native/audio-engine/target
      - ./resources/bin:/app/resources/bin
    command: >
      sh -c "
        mkdir -p /app/resources/bin &&
        cp /app/native/audio-engine/target/release/audio-engine /app/resources/bin/audio-engine-linux &&
        chmod +x /app/resources/bin/audio-engine-linux &&
        echo '✓ Linux binary: resources/bin/audio-engine-linux'
      "

  # Build Windows binary (cross-compiled)
  rust-build-windows:
    build:
      context: .
      target: rust-builder-windows
    volumes:
      - rust-target-windows:/app/native/audio-engine/target
      - ./resources/bin:/app/resources/bin
    command: >
      sh -c "
        mkdir -p /app/resources/bin &&
        cp /app/native/audio-engine/target/x86_64-pc-windows-gnu/release/audio-engine.exe /app/resources/bin/audio-engine-win.exe &&
        echo '✓ Windows binary: resources/bin/audio-engine-win.exe'
      "

  # Build both Linux and Windows binaries
  rust-build-all:
    build:
      context: .
      target: node-base
    depends_on:
      - rust-build-linux
      - rust-build-windows
    command: echo "Build complete. Check resources/bin/ for binaries."

  # Backward compatibility alias
  rust-build:
    build:
      context: .
      target: rust-builder-linux
    volumes:
      - rust-target-linux:/app/native/audio-engine/target
      - ./resources/bin:/app/resources/bin
    command: >
      sh -c "
        mkdir -p /app/resources/bin &&
        cp /app/native/audio-engine/target/release/audio-engine /app/resources/bin/audio-engine-linux &&
        chmod +x /app/resources/bin/audio-engine-linux &&
        echo '✓ Linux binary: resources/bin/audio-engine-linux'
      "

  # Run Rust checks (fmt, clippy, tests)
  rust-check:
    build:
      context: .
      target: rust-builder-linux
    working_dir: /app/native/audio-engine
    volumes:
      - ./native/audio-engine/src:/app/native/audio-engine/src:ro
      - rust-target-linux:/app/native/audio-engine/target
    command: >
      sh -c "
        echo '=== Checking Rust formatting ===' &&
        cargo fmt --all -- --check &&
        echo '=== Running Clippy ===' &&
        cargo clippy --all --workspace --all-targets &&
        echo '=== Running Rust tests ===' &&
        cargo test --all --workspace
      "

  # ---------------------------------------------------------------------------
  # CI Pipeline
  # ---------------------------------------------------------------------------
  ci:
    build:
      context: .
      target: ci
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    env_file:
      - path: .env
        required: false

  # ---------------------------------------------------------------------------
  # Development Shell
  # ---------------------------------------------------------------------------
  dev:
    build:
      context: .
      target: dev
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - rust-target-linux:/app/native/audio-engine/target
    env_file:
      - path: .env
        required: false

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  # Persist node_modules for faster rebuilds
  node_modules:
  # Persist Rust build cache (Linux target)
  rust-target-linux:
  # Persist Rust build cache (Windows cross-compile target)
  rust-target-windows:
