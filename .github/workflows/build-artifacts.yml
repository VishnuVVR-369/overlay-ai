name: Build Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native:
    name: Build Native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: audio-engine-mac-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: audio-engine-win.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/audio-engine

      - name: Build native binary
        working-directory: native/audio-engine
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: |
            native/audio-engine/target/${{ matrix.target }}/release/audio-engine${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  package:
    name: Package (${{ matrix.os }})
    needs: build-native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download macOS arm64 binary
        if: matrix.os == 'macos-latest'
        uses: actions/download-artifact@v4
        with:
          name: audio-engine-mac-arm64
          path: resources/bin/arm64

      - name: Setup macOS binaries
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p resources/bin
          cp resources/bin/arm64/audio-engine resources/bin/audio-engine-mac-arm64
          chmod +x resources/bin/audio-engine-mac-arm64

      - name: Download Windows binary
        if: matrix.os == 'windows-latest'
        uses: actions/download-artifact@v4
        with:
          name: audio-engine-win.exe
          path: resources/bin

      - name: Setup Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path "resources/bin/audio-engine.exe") {
            Move-Item resources/bin/audio-engine.exe resources/bin/audio-engine-win.exe -Force
          }

      - name: Build TypeScript & Vite
        run: npm run build

      - name: Package Electron app
        run: npm run package:${{ matrix.platform }}

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/release/*.dmg
            dist/release/*.exe
            dist/release/*.zip
          retention-days: 30

  create-release:
    name: Create Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          tag_name: v${{ github.run_number }}-${{ github.sha }}
          name: Build from main @ ${{ github.sha }}
          body: |
            ## Automated Build from main branch
            This is an automated release created from commit ${{ github.sha }}.
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
          files: |
            artifacts/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
