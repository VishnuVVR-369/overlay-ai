name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-native:
    name: Build Native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: audio-engine-mac-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: audio-engine-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: audio-engine-win.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/audio-engine

      - name: Install ALSA dev libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build native binary
        working-directory: native/audio-engine
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: |
            native/audio-engine/target/${{ matrix.target }}/release/audio-engine${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  package:
    name: Package (${{ matrix.os }})
    needs: build-native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download macOS arm64 binary
        if: matrix.os == 'macos-latest'
        uses: actions/download-artifact@v4
        with:
          name: audio-engine-mac-arm64
          path: resources/bin/arm64

      - name: Setup macOS binaries
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p resources/bin
          cp resources/bin/arm64/audio-engine resources/bin/audio-engine-mac-arm64
          chmod +x resources/bin/audio-engine-mac-arm64

      - name: Download Linux binary
        if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@v4
        with:
          name: audio-engine-linux
          path: resources/bin

      - name: Setup Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          mv resources/bin/audio-engine resources/bin/audio-engine-linux
          chmod +x resources/bin/audio-engine-linux

      - name: Download Windows binary
        if: matrix.os == 'windows-latest'
        uses: actions/download-artifact@v4
        with:
          name: audio-engine-win.exe
          path: resources/bin

      - name: Setup Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Move-Item resources/bin/audio-engine.exe resources/bin/audio-engine-win.exe

      - name: Build TypeScript & Vite
        run: npm run build

      - name: Package Electron app
        run: npm run package:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/*.exe
            dist/release/*.AppImage
            dist/release/*.deb

  create-release:
    name: Create Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
