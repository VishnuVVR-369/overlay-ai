[package]
name = "audio-engine"
version = "0.1.0"
edition = "2021"
description = "Audio capture sidecar for Overlay AI - captures mic and system audio, outputs PCM to stdout"

[dependencies]
# Cross-platform Audio HAL
cpal = "0.15"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Raw PCM encoding
byteorder = "1.4"

# CLI argument parsing
clap = { version = "4.0", features = ["derive"] }

# Lock-free ring buffer for thread safety
ringbuf = "0.3"

# Signal handling (Ctrl+C)
ctrlc = "3.4"

# macOS ScreenCaptureKit bindings (for system audio capture)
# Note: Using =1.2.0 to avoid macOS 26+ SCScreenshotConfiguration symbols
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "=1.2.0"
